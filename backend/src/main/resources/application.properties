# ============================================================
# BOLT - Banking Operations & Locking Technology
# Application Configuration
# ============================================================

spring.application.name=BOLT

# Server Configuration
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:boltdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thread Pool Configuration
bolt.thread-pool.atm-size=4
bolt.thread-pool.online-size=4

# Default Execution Mode
bolt.default-mode=SAFE

# Deadlock Simulation Timeout (seconds)
bolt.deadlock.timeout-seconds=5

# Logging
logging.level.com.bolt=INFO
logging.level.org.springframework=WARN
